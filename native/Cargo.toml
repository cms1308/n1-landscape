[package]
name = "landscape_native"
version = "0.4.0"
edition = "2021"
description = "Native (Rust) implementations of the measured hot spots of the landscape package; optional at import"
license = "MIT"

[lib]
name = "landscape_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
num-bigint = "0.4"
num-traits = "0.2"
rayon = "1"
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
